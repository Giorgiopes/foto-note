<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foto Note</title>
<meta name="theme-color" content="#1f3a34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
<style>
/* Layout: schermo unico da app — foto grande, posizione e note sotto, barra azioni fissa in basso */
:root{
  --bg:#eef2f0; --card:#ffffff; --fg:#14201b; --muted:#66756e; --line:#dbe3df; --soft:#e4ece8;
  --accent:#0e7a5f; --accent-fg:#ffffff; --rec:#d6452f; --ok:#1f8a4c;
  --font:"Figtree",system-ui,-apple-system,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1311; --card:#17201c; --fg:#e8efeb; --muted:#93a39c; --line:#26322d; --soft:#1f2a25;
  --accent:#4fd1a5; --accent-fg:#06140f; --rec:#ff7a63; --ok:#6fdc96; color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 6px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0}
.stamp{font:600 .85rem var(--font);color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.label{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0}
button{font:700 1rem var(--font);color:var(--fg);cursor:pointer;border:0}
button:focus-visible,textarea:focus-visible,.shot:focus-within{outline:3px solid var(--accent);outline-offset:2px}

/* Foto */
.shot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:4/3;max-width:100%;
  border-radius:20px;background:var(--card);border:2px dashed var(--line);color:var(--muted);cursor:pointer;overflow:hidden}
.shot svg{width:52px;height:52px;color:var(--accent)}
.shot strong{color:var(--fg);font-size:1.1rem}
#photoInput{position:absolute;width:1px;height:1px;opacity:0}
#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.retake{position:absolute;right:10px;bottom:10px;background:rgb(0 0 0 / .6);color:#fff;font-weight:700;font-size:.85rem;padding:7px 12px;border-radius:999px}
.shot.has-photo{border-style:solid;border-color:transparent}

/* Posizione */
.place{display:flex;align-items:center;gap:12px}
.pin{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.pin svg{width:22px;height:22px}
#gps{flex:1;min-width:0;font-size:.95rem;color:var(--muted)}
#gps .addr{color:var(--fg);font-weight:700;line-height:1.3}
#gps .coords{font:.8rem var(--mono);font-variant-numeric:tabular-nums}
#gps a{color:var(--accent);font-size:.85rem;font-weight:700;text-decoration:none}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}

/* Nota */
textarea{width:100%;min-height:96px;border:0;background:var(--soft);border-radius:14px;padding:12px;font:1rem/1.45 var(--font);color:var(--fg);resize:vertical}
textarea::placeholder{color:var(--muted)}

/* Vocali */
.voice{display:flex;align-items:center;gap:14px}
#recBtn{flex:none;width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--rec);display:grid;place-items:center}
#recBtn svg{width:28px;height:28px}
#recBtn.rec{background:var(--rec);color:#fff}
#recLabel{font-weight:700}
.voice small{display:block;color:var(--muted);font-size:.85rem}
.clips{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.clips:empty{display:none}
.clips li{display:flex;align-items:center;gap:8px}
.clips audio{flex:1;min-width:0;height:40px}
.clips button{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:1.1rem}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.2s ease-in-out infinite}@keyframes p{50%{box-shadow:0 0 0 10px rgb(214 69 47 / .18)}}}

/* Barra azioni */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.actions{display:flex;gap:10px}
#newBtn{flex:none;height:54px;padding:0 18px;border-radius:16px;background:var(--soft)}
#saveBtn{flex:1;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-fg);font-size:1.05rem}
#saveBtn:disabled{opacity:.4;cursor:default}
#status{margin:0;min-height:1.2em;font-size:.88rem;font-weight:600;color:var(--muted);text-align:center}
#status:empty{display:none}
#status.ok{color:var(--ok)}#status.err{color:var(--rec)}
#shareBtn{background:none;color:var(--accent);font-size:.9rem;padding:2px}
#saveHint{display:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
</head>
<body>
<main>
  <header><h1>Foto Note</h1><span class="stamp" id="clock"></span></header>

  <label class="shot" id="shot" for="photoInput">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <strong>Scatta una foto</strong>
    <span>La posizione si salva da sola</span>
    <img id="preview" alt="Foto scattata" hidden>
    <span class="retake" id="retake" hidden>Rifai foto</span>
  </label>
  <input id="photoInput" type="file" accept="image/*" capture="environment">

  <div class="card place">
    <div class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
    <div id="gps">Nessuna posizione rilevata.</div>
    <button id="gpsBtn" class="icon-btn" type="button" aria-label="Aggiorna posizione"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>

  <div class="card">
    <p class="label">Nota</p>
    <textarea id="note" placeholder="Scriva qui le osservazioni…"></textarea>
  </div>

  <div class="card">
    <div class="voice">
      <button id="recBtn" type="button" aria-label="Registra nota vocale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <div><span id="recLabel">Nota vocale</span><small id="recSub">Tocchi il microfono per registrare</small></div>
    </div>
    <ul class="clips" id="clips"></ul>
  </div>
</main>

<div class="bar"><div class="bar-in">
  <p id="status" role="status"></p>
  <div class="actions">
    <button id="newBtn" type="button">Nuova</button>
    <button id="saveBtn" type="button" disabled>Salva o invia</button>
  </div>
  <button id="shareBtn" type="button" hidden>Condividi in altro modo</button>
  <p id="saveHint"></p>
</div></div>

<script>
/* ID client OAuth di Google Cloud: se vuoto, l'app usa il menu Condividi */
const CLIENT_ID='';
const $ = id => document.getElementById(id);
const state = { photo:null, photoTime:null, pos:null, addr:'', clips:[] };
const pad = n => String(n).padStart(2,'0');

function tick(){ const d=new Date(); $('clock').textContent=`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
tick(); setInterval(tick, 15000);

function setStatus(msg, kind=''){ $('status').textContent=msg; $('status').className=kind; }
function refreshSave(){ $('saveBtn').disabled = !(state.photo || state.clips.length || $('note').value.trim()); if(typeof schedulePrep==='function') schedulePrep(); }

/* ---------- GPS ---------- */
function locate(){
  if(!('geolocation' in navigator)){ $('gps').textContent='Questo browser non fornisce la posizione.'; return; }
  $('gps').textContent='Rilevamento posizione…';
  navigator.geolocation.getCurrentPosition(p=>{
    state.pos = { lat:p.coords.latitude, lon:p.coords.longitude, acc:Math.round(p.coords.accuracy), alt:p.coords.altitude, t:new Date(p.timestamp) };
    state.addr=''; renderGps(); reverse(); refreshSave();
  }, e=>{
    $('gps').textContent = e.code===1 ? 'Permesso posizione negato: lo abiliti nelle impostazioni del sito.' : 'Posizione non disponibile. Riprovi all\'aperto o con il GPS attivo.';
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:10000 });
}
function renderGps(){
  const p=state.pos; if(!p) return;
  const url=`https://maps.google.com/?q=${p.lat.toFixed(6)},${p.lon.toFixed(6)}`;
  $('gps').innerHTML='';
  const add=(cls,txt)=>{const d=document.createElement('div'); d.className=cls; d.textContent=txt; $('gps').appendChild(d);};
  add('addr', state.addr ? state.addr.split(',').slice(0,3).join(',') : 'Posizione rilevata');
  add('coords', `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)} · ±${p.acc} m`);
  const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.textContent='Apri in Maps'; $('gps').appendChild(a);
}
async function reverse(){
  try{
    const p=state.pos;
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=it&lat=${p.lat}&lon=${p.lon}`);
    if(!r.ok) return; const j=await r.json();
    if(j.display_name && state.pos===p){ state.addr=j.display_name; renderGps(); refreshSave(); }
  }catch(_){}
}
$('gpsBtn').onclick=locate;

/* ---------- Foto ---------- */
$('photoInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  state.photo=f; state.photoTime=new Date();
  $('preview').src=URL.createObjectURL(f); $('preview').hidden=false; $('retake').hidden=false; $('shot').classList.add('has-photo');
  locate(); refreshSave(); setStatus('');
});

/* ---------- Note vocali ---------- */
let rec=null, chunks=[];
const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
$('recBtn').onclick=async()=>{
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; rec=new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const type=rec.mimeType||mime||'audio/webm';
      state.clips.push({ blob:new Blob(chunks,{type}), type, t:new Date() });
      $('recBtn').classList.remove('rec','pulse'); $('recLabel').textContent='Nota vocale'; $('recSub').textContent='Tocchi il microfono per registrarne un\'altra';
      renderClips(); refreshSave();
    };
    rec.start(); $('recBtn').classList.add('rec','pulse'); $('recLabel').textContent='Registrazione in corso…'; $('recSub').textContent='Tocchi di nuovo per fermare';
  }catch(err){ setStatus('Microfono non disponibile: consenta l\'accesso nelle impostazioni del sito.','err'); }
};
function renderClips(){
  const ul=$('clips'); ul.innerHTML='';
  state.clips.forEach((c,i)=>{
    const li=document.createElement('li');
    const au=document.createElement('audio'); au.controls=true; au.src=URL.createObjectURL(c.blob);
    const del=document.createElement('button'); del.type='button'; del.textContent='✕'; del.setAttribute('aria-label',`Elimina nota vocale ${i+1}`);
    del.onclick=()=>{ state.clips.splice(i,1); renderClips(); refreshSave(); };
    li.append(au,del); ul.appendChild(li);
  });
}
$('note').addEventListener('input', refreshSave);

/* ---------- EXIF GPS ---------- */
function toDMS(v){ v=Math.abs(v); const d=Math.floor(v), m=Math.floor((v-d)*60), s=Math.round(((v-d)*60-m)*60*10000); return [[d,1],[m,1],[s,10000]]; }
function readDataURL(blob){ return new Promise((ok,ko)=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=ko; r.readAsDataURL(blob);}); }
async function photoWithGps(file){
  if(!state.pos || !window.piexif || !/jpe?g/i.test(file.type)) return file;
  try{
    const data=await readDataURL(file);
    let exif; try{ exif=piexif.load(data); }catch(_){ exif={'0th':{},'Exif':{},'GPS':{},'1st':{},thumbnail:null}; }
    const p=state.pos, G=piexif.GPSIFD;
    exif.GPS={ [G.GPSVersionID]:[2,3,0,0], [G.GPSLatitudeRef]:p.lat>=0?'N':'S', [G.GPSLatitude]:toDMS(p.lat),
      [G.GPSLongitudeRef]:p.lon>=0?'E':'W', [G.GPSLongitude]:toDMS(p.lon) };
    if(p.alt!=null){ exif.GPS[G.GPSAltitudeRef]=p.alt<0?1:0; exif.GPS[G.GPSAltitude]=[Math.round(Math.abs(p.alt)*100),100]; }
    const out=piexif.insert(piexif.dump(exif), data);
    return await (await fetch(out)).blob();
  }catch(_){ return file; }
}

/* ---------- Salvataggio ---------- */
function baseName(d){ return `${pad(d.getMonth()+1)}_${String(d.getFullYear()).slice(2)}_${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; }
function noteText(d){
  const L=[`Foto Note – ${d.toLocaleString('it-IT')}`,''];
  if(state.pos){ const p=state.pos;
    L.push(`Coordinate: ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)} (±${p.acc} m)`);
    if(state.addr) L.push(`Indirizzo: ${state.addr}`);
    L.push(`Mappa: https://maps.google.com/?q=${p.lat.toFixed(6)},${p.lon.toFixed(6)}`);
  } else L.push('Posizione: non rilevata');
  L.push('', 'Nota:', $('note').value.trim() || '(nessuna)');
  if(state.clips.length) L.push('', `Note vocali allegate: ${state.clips.length}`);
  return L.join('\n');
}
/* I file si preparano in anticipo: Android consente il menu Condividi solo subito dopo il tocco */
let prepared=null, prepVer=0, prepTimer=null;
async function buildFiles(){
  const d=state.photoTime||new Date(), b=baseName(d), files=[];
  if(state.photo) files.push(new File([await photoWithGps(state.photo)], `${b}_foto.jpg`, {type:'image/jpeg'}));
  files.push(new File([noteText(d)], `${b}_nota.txt`, {type:'text/plain'}));
  state.clips.forEach((c,i)=>{ const m4a=/mp4/.test(c.type);
    files.push(new File([c.blob], `${b}_vocale${state.clips.length>1?'_'+(i+1):''}.${m4a?'m4a':'weba'}`, {type:m4a?'audio/x-m4a':'audio/webm'})); });
  return {files, b};
}
function schedulePrep(){
  prepared=null; const v=++prepVer; clearTimeout(prepTimer);
  if($('saveBtn').disabled) return;
  prepTimer=setTimeout(()=>buildFiles().then(p=>{ if(v===prepVer) prepared=p; }).catch(()=>{}), 400);
}
$('saveBtn').onclick=async()=>{
  if(!prepared){
    setStatus('Preparo i file…'); clearTimeout(prepTimer); const v=++prepVer;
    const p=await buildFiles(); if(v!==prepVer) return; prepared=p;
    setStatus('File pronti: tocchi di nuovo "Salva o invia".','ok'); return;
  }
  if(CLIENT_ID) driveSave(); else shareFiles();
};
async function shareFiles(){
  if(!prepared) return;
  const {files,b}=prepared;
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:`Foto Note ${b}`}); setStatus('Inviato al menu Condividi. File inviati all'app scelta.','ok'); }
    catch(e){ setStatus(e.name==='AbortError'?'Condivisione annullata.':'Condivisione non riuscita: '+e.message, e.name==='AbortError'?'':'err'); }
  } else {
    files.forEach(f=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; a.click(); });
    setStatus('Questo browser non supporta la condivisione: i file sono stati scaricati in Download.','ok');
  }
}
$('shareBtn').onclick=()=>{ if(prepared) shareFiles(); else setStatus('Prima tocchi "Salva o invia" per preparare i file.'); };

/* ---------- Caricamento automatico su Google Drive ---------- */
const FOLDER_NAME='Foto Note';
let tokenClient=null;
const ls={ get:k=>{try{return localStorage.getItem(k)}catch(_){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}} };
function tokenValid(){ return ls.get('tok') && Number(ls.get('tokExp')) > Date.now()+60000; }
function initDrive(){
  if(!CLIENT_ID) return;
  $('saveHint').textContent=`I file vengono caricati direttamente nella cartella "${FOLDER_NAME}" del Suo Google Drive. La prima volta Google Le chiede di accedere.`;
  $('shareBtn').hidden=false;
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true;
  s.onload=()=>{ tokenClient=google.accounts.oauth2.initTokenClient({ client_id:CLIENT_ID, scope:'https://www.googleapis.com/auth/drive.file', login_hint:'giorgiopes@gmail.com',
    callback:r=>{ if(r.error){ setStatus('Accesso a Google non riuscito: '+r.error,'err'); return; }
      ls.set('tok',r.access_token); ls.set('tokExp',String(Date.now()+r.expires_in*1000)); ls.set('consent','1'); upload(); } }); };
  document.head.appendChild(s);
}
function driveSave(){
  if(tokenValid()){ upload(); return; }
  if(!tokenClient){ setStatus('Collegamento a Google in caricamento, riprovi tra un attimo.'); return; }
  setStatus('Accesso a Google…');
  tokenClient.requestAccessToken({prompt: ls.get('consent')?'':'consent'});
}
async function gapi(url, opts={}){
  const r=await fetch(url,{...opts, headers:{Authorization:'Bearer '+ls.get('tok'), ...(opts.headers||{})}});
  if(r.status===401){ ls.set('tokExp','0'); throw new Error('sessione scaduta: tocchi di nuovo "Salva o invia"'); }
  if(!r.ok) throw new Error(`errore Drive ${r.status}`);
  return r.json();
}
async function folderId(){
  const cached=ls.get('folderId');
  if(cached){ try{ const f=await gapi(`https://www.googleapis.com/drive/v3/files/${cached}?fields=id,trashed`); if(!f.trashed) return f.id; }catch(e){ if(/sessione/.test(e.message)) throw e; } }
  const q=encodeURIComponent(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const l=await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  let id=l.files && l.files[0] && l.files[0].id;
  if(!id){ const f=await gapi('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'})}); id=f.id; }
  ls.set('folderId',id); return id;
}
async function upload(){
  if(!prepared){ setStatus('Prima tocchi "Salva o invia" per preparare i file.'); return; }
  const {files}=prepared; $('saveBtn').disabled=true;
  try{
    const parent=await folderId();
    for(let i=0;i<files.length;i++){
      const f=files[i]; setStatus(`Caricamento ${i+1} di ${files.length}: ${f.name}`);
      const bd='fn'+Math.random().toString(36).slice(2);
      const body=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`, JSON.stringify({name:f.name,parents:[parent]}),
        `\r\n--${bd}\r\nContent-Type: ${f.type||'application/octet-stream'}\r\n\r\n`, f, `\r\n--${bd}--`]);
      await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${bd}`},body});
    }
    setStatus(`Salvati ${files.length} file nella cartella "${FOLDER_NAME}" su Drive.`,'ok');
  }catch(e){ setStatus('Caricamento non riuscito: '+e.message+'. Può usare "Condividi in altro modo".','err'); }
  finally{ refreshSave(); }
}
$('newBtn').onclick=()=>{
  Object.assign(state,{photo:null,photoTime:null,pos:null,addr:'',clips:[]});
  $('preview').hidden=true; $('preview').removeAttribute('src'); $('retake').hidden=true; $('shot').classList.remove('has-photo'); $('photoInput').value='';
  $('note').value=''; $('gps').textContent='Nessuna posizione rilevata.'; renderClips(); refreshSave(); setStatus('');
};

initDrive();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
